[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fintrace"
version = "0.2.0"
description = "中文企业级批量费控审查 Agent — batch expense-control agent with provenance-first debugging"
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "FinTrace Contributors" },
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Services",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Natural Language :: Chinese",
]

dependencies = [
    "streamlit>=1.36.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "pypdf>=4.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.40.0",
    "langgraph>=1.0.0",
    "langsmith>=0.3.0",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10", "Pillow>=10.0.0"]
eval = ["deepeval", "ragas", "arize-phoenix"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-benchmark>=5.0",
    "mypy>=1.10",
    "ruff>=0.5.0",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/your-org/fintrace"
Documentation = "https://github.com/your-org/fintrace#readme"

[tool.setuptools.packages.find]
include = ["fintrace*", "redteam*", "scripts*"]

[tool.setuptools.package-data]
"*" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["*Test"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_unimported = false
ignore_missing_imports = true
